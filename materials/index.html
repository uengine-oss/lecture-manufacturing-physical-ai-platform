<header><h1>HydOps 강의 — 중간 결과물 갤러리</h1><p>모든 그림은 실제 데이터·실제 실행으로 만들었다. 이미지를 누르면 원본 크기로 연다. 그림 재생성: <code>system/scripts/make_figures.py</code></p></header>
<div class="f"><button class="on" data-f="">전체</button><button data-f="데이터">데이터 그림</button><button data-f="개념도">개념도</button><button data-f="화면">실제 화면</button></div>
<div class="g"><figure class="c" data-k="개념도"><a href="diagrams/D01_architecture.png" target="_blank"><img loading="lazy" src="diagrams/D01_architecture.png"></a><figcaption><span class="tag t-개념도">개념도</span><b>완성 시스템 아키텍처</b><p>B1~B9 와 네 계층, 교육용 플랫폼 대응, 재측정 루프와 공통 연결 키</p><small>실전반 1회 · 통합반 1회</small></figcaption></figure><figure class="c" data-k="개념도"><a href="diagrams/D02_event_path.png" target="_blank"><img loading="lazy" src="diagrams/D02_event_path.png"></a><figcaption><span class="tag t-개념도">개념도</span><b>하나의 사건이 통과하는 경로</b><p>감지부터 근거·승인·실행·재측정까지 같은 event_id</p><small>실전반 1·8회 · 통합반 10회</small></figcaption></figure><figure class="c" data-k="개념도"><a href="diagrams/D07_storage.png" target="_blank"><img loading="lazy" src="diagrams/D07_storage.png"></a><figcaption><span class="tag t-개념도">개념도</span><b>저장소를 나누는 기준</b><p>파일 / PostgreSQL / Neo4j 역할과 결합 키</p><small>실전반 1·3회 · 통합반 2·3회</small></figcaption></figure><figure class="c" data-k="데이터"><a href="figures/F01_uci_1s_reduction.png" target="_blank"><img loading="lazy" src="figures/F01_uci_1s_reduction.png"></a><figcaption><span class="tag t-데이터">데이터</span><b>B1 · 1초 공통 관측 형식</b><p>100 Hz 압력·10 Hz 유량을 1초 평균·최솟값·최댓값으로 축약</p><small>실전반 1회 · 통합반 1회</small></figcaption></figure><figure class="c" data-k="데이터"><a href="figures/F02_uci_cooler_states.png" target="_blank"><img loading="lazy" src="figures/F02_uci_cooler_states.png"></a><figcaption><span class="tag t-데이터">데이터</span><b>B1 · 냉각기 상태별 온도</b><p>정답 라벨은 평가에만 — 100% 36°C · 20% 45°C · 3% 56°C</p><small>실전반 1회 · 통합반 1회</small></figcaption></figure><figure class="c" data-k="데이터"><a href="figures/F03_quality_flags.png" target="_blank"><img loading="lazy" src="figures/F03_quality_flags.png"></a><figcaption><span class="tag t-데이터">데이터</span><b>B2 · 품질 플래그</b><p>원시 값 보존, 정제 값에서만 비움 — 결측·급등·고착</p><small>실전반 2회 · 통합반 2회</small></figcaption></figure><figure class="c" data-k="데이터"><a href="figures/F08_neo4j_asset_graph.png" target="_blank"><img loading="lazy" src="figures/F08_neo4j_asset_graph.png"></a><figcaption><span class="tag t-데이터">데이터</span><b>B4 · 설비 관계 그래프</b><p>설비마다 다른 SOP·허용 조치, 폐기 판은 점선</p><small>실전반 3회 · 통합반 3회</small></figcaption></figure><figure class="c" data-k="화면"><a href="screenshots/S07_neo4j_browser_graph.png" target="_blank"><img loading="lazy" src="screenshots/S07_neo4j_browser_graph.png"></a><figcaption><span class="tag t-화면">화면</span><b>B4 · Neo4j Browser</b><p>SOP–APPLIES_TO–Asset–HAS_SENSOR 경로 질의</p><small>실전반 3회 · 통합반 3회</small></figcaption></figure><figure class="c" data-k="데이터"><a href="figures/F04_phase_baseline_residual.png" target="_blank"><img loading="lazy" src="figures/F04_phase_baseline_residual.png"></a><figcaption><span class="tag t-데이터">데이터</span><b>B5 · 정상 위상 기준</b><p>같은 위상끼리 비교하고 이동평균 잔차가 지속될 때만 이상</p><small>실전반 4회 · 통합반 4회</small></figcaption></figure><figure class="c" data-k="데이터"><a href="figures/F05_detection_eval_compare.png" target="_blank"><img loading="lazy" src="figures/F05_detection_eval_compare.png"></a><figcaption><span class="tag t-데이터">데이터</span><b>B5 · 임계값과 지속 조건</b><p>오탐은 허용 한계가 줄이고(4→1), 지속 조건은 임계값 근처 떨림을 거른다(99→0)</p><small>실전반 4회 · 통합반 4회</small></figcaption></figure><figure class="c" data-k="데이터"><a href="figures/F10_zeroshot_vs_rules.png" target="_blank"><img loading="lazy" src="figures/F10_zeroshot_vs_rules.png"></a><figcaption><span class="tag t-데이터">데이터</span><b>B5 선택 · zero-shot 예측 비교</b><p>급변은 먼저 잡고, 처음부터 저하된 사이클은 놓친다</p><small>실전반 4회 · 통합반 5회</small></figcaption></figure><figure class="c" data-k="화면"><a href="screenshots/S01_dashboard_normal.png" target="_blank"><img loading="lazy" src="screenshots/S01_dashboard_normal.png"></a><figcaption><span class="tag t-화면">화면</span><b>B9 · 정상 운전</b><p>사건 없음 — 조치 없음</p><small>실전반 4회 · 통합반 4회</small></figcaption></figure><figure class="c" data-k="화면"><a href="screenshots/S02_dashboard_sensor_fault.png" target="_blank"><img loading="lazy" src="screenshots/S02_dashboard_sensor_fault.png"></a><figcaption><span class="tag t-화면">화면</span><b>B9 · 센서 오류</b><p>결측 → 센서 점검 제안, 설비 조치 보류</p><small>실전반 4·5회 · 통합반 4회</small></figcaption></figure><figure class="c" data-k="데이터"><a href="figures/F09_sop_search_filter.png" target="_blank"><img loading="lazy" src="figures/F09_sop_search_filter.png"></a><figcaption><span class="tag t-데이터">데이터</span><b>B6 · SOP 검색 필터</b><p>설비·버전 필터가 근거의 범위를 정한다</p><small>실전반 5회 · 통합반 5회</small></figcaption></figure><figure class="c" data-k="개념도"><a href="diagrams/D04_skill_sop_tool.png" target="_blank"><img loading="lazy" src="diagrams/D04_skill_sop_tool.png"></a><figcaption><span class="tag t-개념도">개념도</span><b>Skill · SOP · 도구</b><p>업무 지침 / 문서 근거 / 실행 기능 + 도구 계약 표</p><small>실전반 5·7회 · 통합반 5·6회</small></figcaption></figure><figure class="c" data-k="화면"><a href="screenshots/S06_dashboard_hold_no_evidence.png" target="_blank"><img loading="lazy" src="screenshots/S06_dashboard_hold_no_evidence.png"></a><figcaption><span class="tag t-화면">화면</span><b>B7 · 근거 없음 보류</b><p>SOP 가 없는 HYD-03 은 제안하지 않는다</p><small>실전반 5회 · 통합반 6회</small></figcaption></figure><figure class="c" data-k="화면"><a href="screenshots/S03_dashboard_pending_approval.png" target="_blank"><img loading="lazy" src="screenshots/S03_dashboard_pending_approval.png"></a><figcaption><span class="tag t-화면">화면</span><b>B7·B8 · 승인 대기</b><p>도구 호출 이력·SOP 인용·승인 폼</p><small>실전반 5·7회 · 통합반 6회</small></figcaption></figure><figure class="c" data-k="화면"><a href="screenshots/S08_dashboard_rejected.png" target="_blank"><img loading="lazy" src="screenshots/S08_dashboard_rejected.png"></a><figcaption><span class="tag t-화면">화면</span><b>B8 · 승인 거부</b><p>미실행 종료 — 실행 기록 없음</p><small>실전반 7회 · 통합반 6회</small></figcaption></figure><figure class="c" data-k="개념도"><a href="diagrams/D03_state_flow.png" target="_blank"><img loading="lazy" src="diagrams/D03_state_flow.png"></a><figcaption><span class="tag t-개념도">개념도</span><b>B8 · 상태 흐름과 분기</b><p>합격 목표 네 가지 0건</p><small>실전반 7·8회 · 통합반 6·10회</small></figcaption></figure><figure class="c" data-k="데이터"><a href="figures/F06_closed_loop_same_seed.png" target="_blank"><img loading="lazy" src="figures/F06_closed_loop_same_seed.png"></a><figcaption><span class="tag t-데이터">데이터</span><b>B8 · 폐루프</b><p>같은 시드에서 조치 유무 비교, 재측정 창</p><small>실전반 8회 · 통합반 10회</small></figcaption></figure><figure class="c" data-k="데이터"><a href="figures/F07_verification_outcomes.png" target="_blank"><img loading="lazy" src="figures/F07_verification_outcomes.png"></a><figcaption><span class="tag t-데이터">데이터</span><b>B8 · 재측정 세 갈래</b><p>회복 · 미개선 · 데이터 부족</p><small>실전반 8회 · 통합반 10회</small></figcaption></figure><figure class="c" data-k="화면"><a href="screenshots/S04_dashboard_closed.png" target="_blank"><img loading="lazy" src="screenshots/S04_dashboard_closed.png"></a><figcaption><span class="tag t-화면">화면</span><b>B8·B9 · 회복 종결</b><p>명령 성공과 회복 판정이 따로 남는다</p><small>실전반 8회 · 통합반 10회</small></figcaption></figure><figure class="c" data-k="화면"><a href="screenshots/S05_dashboard_escalated.png" target="_blank"><img loading="lazy" src="screenshots/S05_dashboard_escalated.png"></a><figcaption><span class="tag t-화면">화면</span><b>B8 · 미개선 이관</b><p>명령 SUCCEEDED 인데 회복 실패 → 이관</p><small>실전반 8회 · 통합반 10회</small></figcaption></figure><figure class="c" data-k="개념도"><a href="diagrams/D05_local_vs_platform.png" target="_blank"><img loading="lazy" src="diagrams/D05_local_vs_platform.png"></a><figcaption><span class="tag t-개념도">개념도</span><b>로컬과 플랫폼</b><p>같은 서비스 함수를 LangGraph 와 플랫폼 프로세스가 부른다</p><small>실전반 6회 · 통합반 7회</small></figcaption></figure><figure class="c" data-k="화면"><a href="screenshots/S10_platform_home.png" target="_blank"><img loading="lazy" src="screenshots/S10_platform_home.png"></a><figcaption><span class="tag t-화면">화면</span><b>교육용 플랫폼 · 개요</b><p>네 계층 카드</p><small>실전반 6회 · 통합반 7회</small></figcaption></figure><figure class="c" data-k="화면"><a href="screenshots/S11_platform_fabric.png" target="_blank"><img loading="lazy" src="screenshots/S11_platform_fabric.png"></a><figcaption><span class="tag t-화면">화면</span><b>Data Fabric</b><p>사전 등록된 교육용 DB · 메타데이터 · 읽기 전용 질의</p><small>실전반 6회 · 통합반 7회</small></figcaption></figure><figure class="c" data-k="화면"><a href="screenshots/S12_platform_studio_unpublished.png" target="_blank"><img loading="lazy" src="screenshots/S12_platform_studio_unpublished.png"></a><figcaption><span class="tag t-화면">화면</span><b>Ontology Studio · 발행 전</b><p>매핑이 있어도 발행 전에는 조회 거부</p><small>실전반 6회 · 통합반 7회</small></figcaption></figure><figure class="c" data-k="화면"><a href="screenshots/S13_platform_studio_published_golden.png" target="_blank"><img loading="lazy" src="screenshots/S13_platform_studio_published_golden.png"></a><figcaption><span class="tag t-화면">화면</span><b>Ontology Studio · 발행 후</b><p>객체 조회와 Golden Question 3개</p><small>실전반 6회 · 통합반 7회</small></figcaption></figure><figure class="c" data-k="화면"><a href="screenshots/S14_platform_agents_mcp_watch.png" target="_blank"><img loading="lazy" src="screenshots/S14_platform_agents_mcp_watch.png"></a><figcaption><span class="tag t-화면">화면</span><b>Agents · Skill · MCP · Watch</b><p>허용 도구 4개, 조회 호출, 감시 에이전트로 업무 시작</p><small>실전반 7회 · 통합반 8회</small></figcaption></figure><figure class="c" data-k="화면"><a href="screenshots/S15_platform_worklist_approval.png" target="_blank"><img loading="lazy" src="screenshots/S15_platform_worklist_approval.png"></a><figcaption><span class="tag t-화면">화면</span><b>Process · 승인 태스크</b><p>event_id·asset_id·run_id·제안값·근거가 폼에 매핑</p><small>실전반 7회 · 통합반 8회</small></figcaption></figure><figure class="c" data-k="화면"><a href="screenshots/S16_platform_instance_closed.png" target="_blank"><img loading="lazy" src="screenshots/S16_platform_instance_closed.png"></a><figcaption><span class="tag t-화면">화면</span><b>Process · 인스턴스 기록</b><p>업무 결과와 설비 재측정이 따로</p><small>실전반 8회 · 통합반 8회</small></figcaption></figure><figure class="c" data-k="화면"><a href="screenshots/S17_platform_apps.png" target="_blank"><img loading="lazy" src="screenshots/S17_platform_apps.png"></a><figcaption><span class="tag t-화면">화면</span><b>Apps · 게시 로그</b><p>검증 → 번들 → 상태 확인 → 게시</p><small>실전반 9회 · 통합반 9회</small></figcaption></figure><figure class="c" data-k="화면"><a href="screenshots/S18_app_ops_console.png" target="_blank"><img loading="lazy" src="screenshots/S18_app_ops_console.png"></a><figcaption><span class="tag t-화면">화면</span><b>게시된 제조 운영 앱</b><p>화면·프로세스·조치 기록이 같은 사건 ✔✔✔</p><small>실전반 9회 · 통합반 9·10회</small></figcaption></figure><figure class="c" data-k="개념도"><a href="diagrams/D06_roadmap.png" target="_blank"><img loading="lazy" src="diagrams/D06_roadmap.png"></a><figcaption><span class="tag t-개념도">개념도</span><b>회차별 블록 로드맵</b><p>두 반의 회차 × B1~B9</p><small>전 회차</small></figcaption></figure></div>
<script>document.querySelectorAll('.f button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.f button').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.c').forEach(c=>c.style.display=!b.dataset.f||c.dataset.k===b.dataset.f?'':'none')})</script></html>
